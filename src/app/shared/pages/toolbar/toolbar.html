<mat-toolbar class="toolbar">
  <div class="logo">
    <mat-icon class="icon">shield</mat-icon>
    <div class="brand">
      <h1>WallEye</h1>
      <p>Sistema de Monitoramento</p>
    </div>
  </div>
  <div class="btn-container">
    <button *ngIf="detectarLogin() && !detectarLoginEPagina()" (click)="irAdicionarDispositivo()" matButton="outlined">
      <mat-icon>login</mat-icon> Adicionar Dispositivo
    </button>

    <button *ngIf="detectarLoginEPagina()" matButton="outlined" (click)="acessarDashboard()" routerLinkActive="active">
      <mat-icon>login</mat-icon> Acessar dashboard
    </button>

    <button *ngIf="detectarLogin()" matButton="filled" (click)="logout()">
      <mat-icon>login</mat-icon> Logout
    </button>

    <button *ngIf="!detectarLogin()" matButton="filled" (click)="irLogar()" routerLinkActive="active">
      <mat-icon>login</mat-icon> Acessar sistema
    </button>

  </div>
</mat-toolbar>

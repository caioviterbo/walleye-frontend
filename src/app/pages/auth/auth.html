<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <mat-icon class="shield">shield</mat-icon>
      <h1>WallEye</h1>
      <p>Sistema de Detecção de Rachaduras</p>
    </div>

    <mat-card>
      <h2>Acesso ao Sistema</h2>
      <p>Entre ou crie sua conta para continuar</p>

      <mat-tab-group [(selectedIndex)]="selectedTab">
        <mat-tab label="Login">
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" placeholder="seu@email.com">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Senha</mat-label>
              <input matInput type="password" formControlName="senha">
            </mat-form-field>

            <button mat-flat-button color="primary" class="full-width">Entrar</button>
          </form>
        </mat-tab>

        <mat-tab label="Registro">
          <form [formGroup]="registerForm" (ngSubmit)="registro()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Nome</mat-label>
              <input matInput formControlName="nome" placeholder="Seu nome completo">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput formControlName="email" placeholder="seu@email.com">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Senha</mat-label>
              <input matInput type="password" formControlName="senha">
            </mat-form-field>

            <button mat-flat-button color="primary" class="full-width">Registrar</button>
          </form>
        </mat-tab>
      </mat-tab-group>

      <a class="back-link" href="#">← Voltar para o início</a>
    </mat-card>
  </div>
</div>

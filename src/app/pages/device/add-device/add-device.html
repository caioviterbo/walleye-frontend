<div class="add-device-container">
  <h1>Adicionar Dispositivo</h1>
  <p class="subtitle">Configure um novo dispositivo de monitoramento estrutural</p>

  <mat-card class="form-card">
    <div class="header">
      <mat-icon class="icon">shield</mat-icon>
      <div>
        <h2>Novo Dispositivo</h2>
        <p>Insira as informações do dispositivo</p>
      </div>
    </div>

    <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome do Dispositivo</mat-label>
        <input matInput formControlName="nome" placeholder="Ex: Sensor A-101" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Localização</mat-label>
        <input matInput formControlName="localizacao" placeholder="Ex: Bloco A - Coluna 12" />
      </mat-form-field>

      <div class="btn-group">
        <button mat-flat-button color="primary" class="primary-btn" [disabled]="deviceForm.invalid">
          <mat-icon>add</mat-icon>
          Adicionar Dispositivo
        </button>

        <button mat-stroked-button color="basic" type="button" (click)="onCancel()">
          Cancelar
        </button>
      </div>
    </form>
  </mat-card>
</div>
